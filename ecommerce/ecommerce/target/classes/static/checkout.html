<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>Checkout</h1>

    <a href="cart.html">
        Back to Cart
    </a>

</header>

<main>

    <form id="checkoutForm">

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            required>


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            required>


        <label for="phone">
            Phone
        </label>

        <input
            type="text"
            id="phone"
            maxlength="10"
            required>


        <label for="address">
            Address
        </label>

        <textarea
            id="address"
            required>
        </textarea>


        <button type="submit">
            Place Order
        </button>

    </form>

    <p id="errorMessage"></p>

</main>

<script src="checkout.js"></script>

</body>
</html>
